<style>
/* VOICE: calm study companion, direct and encouraging, Turkish UI with English material
   IDEA: the exam booklet she marked with a yellow highlighter — answers, notes, margins
   PICTURE: her own November score sheet drawn as highlighter bars by topic
   COLOUR and TYPE: paper white, ink black, cobalt pen, highlighter yellow; Archivo + Source Serif 4 for texts
   LAYOUT: one column, sticky bottom tab bar on phones, top tabs on wide screens */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#111318);--ink:light-dark(#15171c,#eceef3);--mut:light-dark(#5b606b,#a3a8b4);--line:light-dark(#e3e5ea,#2a2e37);--card:light-dark(#f6f7f9,#191c23);--pen:light-dark(#2340c8,#93a6ff);--hl:light-dark(#e6dbff,#4b3a7d);--hl2:light-dark(#a98bf0,#9a80e6);--hlink:light-dark(#1d1530,#f4efff);--ok:light-dark(#127a46,#5fd197);--bad:light-dark(#c4302b,#ff8a84)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Archivo,system-ui,sans-serif;overflow-x:clip;padding-bottom:84px}
h1,h2,h3{line-height:1.08;text-wrap:balance;margin:0 0 .4em}
h1{font-size:clamp(30px,6vw,46px);font-weight:800}h2{font-size:24px;font-weight:800}h3{font-size:18px;font-weight:600}
.wrap{max-width:860px;margin:0 auto;padding:20px max(4vw,16px)}
.mut{color:var(--mut)}.small{font-size:14px}
mark,.hl{background:var(--hl);color:var(--hlink);padding:.05em .25em;border-radius:.2em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
nav.tabs{position:fixed;inset:auto 0 0 0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));background:var(--bg);border-top:1px solid var(--line);z-index:9;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 2px 10px;font-size:13px;color:var(--mut);text-decoration:none;min-height:56px}
nav.tabs a svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
nav.tabs a.on{color:var(--pen);font-weight:600}
@media(min-width:900px){body{padding-bottom:0}nav.tabs{position:sticky;top:0;inset:auto;border:0;border-bottom:1px solid var(--line);grid-template-columns:repeat(6,auto);justify-content:center;gap:8px}nav.tabs a{flex-direction:row;gap:8px;padding:14px 18px;font-size:15px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:12px}
button,.btn{font:inherit;font-size:16px;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:8px 14px;cursor:pointer}
button.pri{background:var(--pen);border-color:var(--pen);color:#fff;font-weight:600}
:root[data-theme=dark] button.pri{color:#111318}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) button.pri{color:#111318}}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--pen);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pick{display:block;width:100%;text-align:start;margin:8px 0;padding:11px 14px;line-height:1.4}
.pick b{color:var(--pen);margin-inline-end:8px}
.pick.ok{border-color:var(--ok);box-shadow:inset 4px 0 0 var(--ok)}.pick.bad{border-color:var(--bad);box-shadow:inset 4px 0 0 var(--bad)}
.ex{border-inline-start:4px solid var(--hl2);padding:10px 14px;background:var(--card);border-radius:0 10px 10px 0;margin-top:10px}
.bars .b{display:grid;grid-template-columns:8.5em minmax(0,1fr) 3.2em;gap:10px;align-items:center;margin:9px 0;font-size:15px}
.track{height:18px;background:var(--line);border-radius:4px;overflow:hidden}.fill{height:100%;background:var(--hl2)}
.bars .n{text-align:end;font-variant-numeric:tabular-nums;white-space:nowrap}
.big{font-size:clamp(44px,12vw,72px);font-weight:800;line-height:1}
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:24px;align-items:center}
@media(max-width:640px){.hero{grid-template-columns:1fr}}
.text{font-family:"Source Serif 4",Georgia,serif;font-size:17px;line-height:1.7;max-width:68ch}
.gl{border-bottom:2px solid var(--pen);cursor:pointer;border-radius:2px;transition:background .2s}
.gl:hover,.gl:focus{background:color-mix(in srgb,var(--hl) 55%,transparent);outline:none}
.gl.p-n{border-color:#2f6fe4}.gl.p-v{border-color:#17924f}.gl.p-adj{border-color:#e07b00}.gl.p-adv{border-color:#9b4dd6}.gl.p-phr,.gl.p-prep,.gl.p-conj{border-color:#0e8a95}
.legend .gl,td .gl{display:inline-block;margin:2px 6px 2px 0;font-size:13px;padding:1px 8px;border-style:solid;border-width:1.5px 1.5px 3px;border-radius:99px}
.tip{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);max-width:min(92vw,420px);background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;z-index:20;font-size:15px}
.flash{min-height:230px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;cursor:pointer;user-select:none}
.flash .w{font-size:clamp(28px,7vw,40px);font-weight:800}
.chip{display:inline-block;font-size:13px;border:1px solid var(--line);border-radius:99px;padding:2px 10px;color:var(--mut)}
.chip.k{background:var(--hl);color:var(--hlink);border-color:transparent}
input[type=search],select{font:inherit;font-size:16px;min-height:44px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--bg);color:var(--ink);width:100%}
table{border-collapse:collapse;width:100%;font-size:15px;margin:10px 0}th,td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:start;vertical-align:top}th{font-weight:600}
.scroll{overflow-x:auto}
.vl{list-style:none;padding:0;margin:0}.vl li{border-bottom:1px solid var(--line);padding:10px 2px}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:8px 0 14px}.prog i{display:block;height:100%;background:var(--pen)}
.back{background:none;border:0;color:var(--pen);padding:8px 0;font-weight:600}
.err li{margin:8px 0}
.pick.bad{color:var(--bad)}.red{color:var(--bad);font-weight:700;text-decoration:underline wavy;text-underline-offset:4px}.grn{color:var(--ok);font-weight:700;text-decoration:underline;text-underline-offset:4px}
.fs{font-family:"Source Serif 4",Georgia,serif;font-size:17px;line-height:1.6;margin:.3em 0}.lbl{font-size:13px;color:var(--mut);margin:.8em 0 0}.why{color:var(--bad);margin:.3em 0}.trn{font-style:italic;margin:.3em 0}
.wk{padding:10px 0;border-bottom:1px solid var(--line)}.wk:last-child{border:0}.wk .track{height:10px}
.cdrow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:8px 0}.cdc{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 4px;text-align:center}.cdc b{display:block;font-size:clamp(26px,7vw,40px);font-weight:800;line-height:1;font-variant-numeric:tabular-nums}.cdc span{font-size:13px;color:var(--mut)}.ring{width:120px;height:120px}a.b:hover .track{outline:2px solid var(--line)}
.dcard{border-bottom:1px solid var(--line);padding:14px 0}.dcard .w{font-size:24px;font-weight:800}

/* ---- canlı arayüz: fosforlu kalem çizgisi, ışıltı, hareket ---- */
h1 .mk{position:relative;display:inline;color:var(--hlink);background:linear-gradient(var(--hl),var(--hl)) no-repeat 0 0/100% 100%;-webkit-box-decoration-break:clone;box-decoration-break:clone;padding:.02em .22em .06em;border-radius:.18em;line-height:1.3}
.card{transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease}
a.card:hover,.grid .card:hover{transform:translateY(-3px);box-shadow:0 10px 24px -12px rgba(35,64,200,.45);border-color:var(--pen)}
button.pri{position:relative;overflow:hidden;box-shadow:0 6px 16px -8px var(--pen)}
button.pri::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.45) 50%,transparent 70%);transform:translateX(-120%)}
button.pri:hover::after{transform:translateX(120%);transition:transform .7s ease}
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--card) 0%,var(--card) 55%,color-mix(in srgb,var(--hl) 28%,var(--card)) 100%)}
.hero::before,.hero::after{content:"✦";position:absolute;color:var(--hl2);font-size:22px;opacity:.0;pointer-events:none}
.hero::before{top:12px;right:18px}.hero::after{bottom:14px;right:42%;font-size:16px;color:var(--pen)}
.cdc{position:relative;background:linear-gradient(180deg,var(--bg),var(--card))}
.cdc b{color:var(--pen)}
nav.tabs a.on{position:relative}
nav.tabs a.on::after{content:"";position:absolute;left:22%;right:22%;bottom:6px;height:4px;border-radius:2px;background:var(--hl2)}
.pick{transition:transform .15s ease,border-color .2s,background .2s}
.pick:hover:not([disabled]){border-color:var(--pen);transform:translateX(3px)}
.pick.ok{background:color-mix(in srgb,var(--ok) 10%,var(--bg))}.pick.bad{background:color-mix(in srgb,var(--bad) 8%,var(--bg))}
.spark{position:fixed;pointer-events:none;z-index:50;font-size:16px;color:var(--hl2);text-shadow:0 0 8px var(--hl2)}
.confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:50;pointer-events:none;border-radius:2px}
.why2{margin:.5em 0 0;padding:0;list-style:none}.why2 li{padding:6px 0;border-top:1px dashed var(--line);font-size:15px}
.why2 b{color:var(--bad)}
.rlink{display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:8px 12px;border-radius:10px;border:1px solid var(--pen);color:var(--pen);font-weight:600;background:var(--bg);cursor:pointer;font:inherit;font-size:15px;min-height:40px}
.sheet{position:fixed;inset:0;z-index:40;background:rgba(10,12,20,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet>div{background:var(--bg);color:var(--ink);width:min(860px,100%);max-height:86vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px max(4vw,16px) 28px;box-shadow:0 -10px 30px rgba(0,0,0,.25)}
.sheet .bar{position:sticky;top:-18px;background:var(--bg);display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);margin-bottom:10px}
.badge-ok{display:inline-block;padding:2px 10px;border-radius:99px;background:var(--ok);color:#fff;font-size:13px;font-weight:700}
@media(prefers-reduced-motion:no-preference){
 h1 .mk{animation:sweep .9s cubic-bezier(.2,.7,.2,1) both}
 @keyframes sweep{from{background-size:0% 100%}to{background-size:100% 100%}}
 .hero::before{animation:twinkle 3.2s ease-in-out infinite}.hero::after{animation:twinkle 4.1s 1.2s ease-in-out infinite}
 @keyframes twinkle{0%,100%{opacity:0;transform:scale(.6) rotate(0)}50%{opacity:1;transform:scale(1.15) rotate(25deg)}}
 .ring circle+circle{animation:ringin 1.2s ease-out both}@keyframes ringin{from{stroke-dasharray:0 400}}
 .pick.ok{animation:glow 1s ease-out}@keyframes glow{0%{box-shadow:inset 4px 0 0 var(--ok),0 0 0 0 color-mix(in srgb,var(--ok) 60%,transparent)}100%{box-shadow:inset 4px 0 0 var(--ok),0 0 0 14px transparent}}
 .pick.bad{animation:shake .4s ease}@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
 .spark{animation:fly .8s ease-out forwards}@keyframes fly{to{transform:translate(var(--dx),var(--dy)) scale(.3) rotate(160deg);opacity:0}}
 .confetti{animation:fall var(--t,2.4s) linear forwards}@keyframes fall{to{transform:translateY(105vh) rotate(var(--r,540deg))}}
 .cdc.tick b{animation:pop .35s ease}@keyframes pop{50%{transform:scale(1.12)}}
 .sheet>div{animation:up .3s ease-out}@keyframes up{from{transform:translateY(40px);opacity:0}}
 .ex{animation:fadein .35s ease}@keyframes fadein{from{opacity:0;transform:translateY(6px)}}
}

/* ---- oyun ---- */
.ghead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
.hearts{font-size:22px;letter-spacing:2px;color:var(--bad)}.hearts .off{color:var(--line)}
.score{font-weight:800;font-size:22px;font-variant-numeric:tabular-nums}
.combo{display:inline-block;padding:2px 10px;border-radius:99px;background:var(--hl);color:var(--hlink);font-weight:800;font-size:14px}
.gsent{font-family:"Source Serif 4",Georgia,serif;font-size:19px;line-height:1.7;margin:.2em 0 .8em}
.gblank{display:inline-block;min-width:3em;border-bottom:3px solid var(--pen);color:var(--pen);font-weight:700;text-align:center}
.slots{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 14px}
.slot{width:34px;height:42px;border-radius:8px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font:800 20px Archivo,sans-serif;text-transform:lowercase;background:var(--bg)}
.slot.f{border-color:var(--pen);color:var(--pen)}.slot.cur{border-color:var(--hl2);box-shadow:0 0 0 3px color-mix(in srgb,var(--hl2) 40%,transparent)}
.slot.rev{border-color:var(--bad);color:var(--bad)}
.tiles{display:flex;flex-wrap:wrap;gap:8px}
.tile{min-width:44px;height:48px;border-radius:10px;border:1px solid var(--line);background:var(--card);font:800 20px Archivo,sans-serif;cursor:pointer;color:var(--ink);box-shadow:0 3px 0 var(--line)}
.tile:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.tile.used{opacity:.25;pointer-events:none}.tile.no{border-color:var(--bad);color:var(--bad)}
.hints{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.hints button{font-size:14px;min-height:40px}
.hintbox{margin-top:10px;padding:8px 12px;border-radius:10px;background:var(--card);border:1px dashed var(--pen);font-size:15px}
.mgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.mbtn{min-height:54px;text-align:start;line-height:1.25;font-size:15px}
.mbtn.sel{border-color:var(--pen);box-shadow:0 0 0 3px color-mix(in srgb,var(--pen) 30%,transparent)}
.mbtn.done{opacity:0;pointer-events:none;transition:opacity .4s}
.mbtn.no{border-color:var(--bad)}
.gtimer{height:8px;border-radius:4px;background:var(--line);overflow:hidden}.gtimer i{display:block;height:100%;background:var(--pen);transition:width 1s linear}


/* ---- hedef ve plan ---- */
.plancard{display:block;border:2px solid var(--pen);background:linear-gradient(135deg,color-mix(in srgb,var(--pen) 10%,var(--card)),var(--card))}
.pform{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:12px}
.pform label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mut)}.pform label[hidden]{display:none}
.pform select,.pform input{min-height:42px;padding:6px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:16px}
.pstat{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;text-align:center}
.pstat b{display:block;font:800 30px/1.1 Archivo,sans-serif;color:var(--pen)}.pstat span{font-size:12px;color:var(--mut)}
@media(max-width:520px){.pstat{grid-template-columns:1fr 1fr}}
.phases{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.ph{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;background:var(--card)}
.ph.on{border:2px solid var(--hl2);background:color-mix(in srgb,var(--hl) 40%,var(--card))}.ph span{font-size:13px;color:var(--mut)}.ph small{font-size:13px}
.dplan{display:grid;gap:6px}.dplan a{display:grid;grid-template-columns:64px minmax(0,1fr) 14px;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:inherit;text-decoration:none}
.dplan .dm{font:800 17px Archivo,sans-serif;color:var(--pen)}.dplan small{display:block;font-size:13px;color:var(--mut)}
ul.wk li{margin:.35em 0}.sbox a{color:var(--pen);font-weight:600}

with regard to|prep|ile ilgili olarak|There is little data with regard to rural schools.|
in contrast to|prep|-in aksine|In contrast to its neighbours, the country kept its borders open.|
along with|prep|ile birlikte|Fever, along with fatigue, is a common symptom.|`;
const POS={n:"İsim",v:"Fiil",adj:"Sıfat",adv:"Zarf",phr:"Phrasal / kalıp fiil",prep:"Edat öbeği"};
const W=RAW.trim().split("\n").map(l=>{const[w,p,t,e,k]=l.split("|");return{w,p,t,e,k:!!k}});

/* ===================== DATA: GRAMER ===================== */
const L=[
{id:"baglac",t:"Bağlaçlar ve geçiş ifadeleri",body:`<p>YDS bağlaç sorularında iki şey sorulur: <b>anlam</b> (iki cümle arasındaki ilişki) ve <b>yapı</b> (arkasından cümle mi, isim mi, -ing mi geliyor; noktalı virgül var mı). Her satırdaki <b>Yapı</b> sütunu seçenekleri hızlıca elemeni sağlar.</p><div class="card"><b>3 adımlı yöntem</b><br>1 · Boşluktan önceki ve sonraki cümleyi Türkçe bağla: “ama / oysa / çünkü / bu yüzden / -mesi için / şartıyla / üstelik / örneğin / yerine”.<br>2 · Boşluktan sonra ne geliyor? <b>Tam cümle</b> → although, because, whereas … · <b>İsim / -ing</b> → despite, because of, in addition to … · <b>Noktalı virgül veya nokta + virgül</b> → however, therefore, moreover …<br>3 · Kalan seçeneklerden anlamı tutanı seç.</div><h3 style="margin-top:22px">Zıtlık · beklenmeyen sonuç (-e rağmen)</h3><p class="mut small">Birinci cümle, ikincisinin tersini bekletir.</p><div class="scroll"><table class="stack"><thead><tr><th>Bağlaç</th><th>Yapı</th><th>Örnek</th><th>Not</th></tr></thead><tbody><tr><td><b>although / even though / though</b></td><td><code>Although + özne + yüklem, ana cümle</code></td><td><b>Although</b> the treatment is expensive, many patients choose it.<br><span class="mut small">Tedavi pahalı olmasına rağmen birçok hasta onu seçiyor.</span></td><td class="small">even though daha vurguludur. though cümle sonunda zarf da olur: It was hard. I enjoyed it, though.</td></tr><tr><td><b>despite / in spite of</b></td><td><code>Despite + isim / -ing, ana cümle</code></td><td><b>Despite</b> the high cost, many patients choose the treatment. · <b>Despite</b> being expensive, …<br><span class="mut small">Yüksek maliyete rağmen …</span></td><td class="small">Arkasından ÖZNE + YÜKLEM gelmez. Cümle eklemek için: despite the fact that + cümle.</td></tr><tr><td><b>however / nevertheless / nonetheless / even so / still</b></td><td><code>Cümle 1; however, cümle 2. ya da Cümle 1. However, cümle 2.</code></td><td>The treatment is expensive; <b>nevertheless</b>, many patients choose it.<br><span class="mut small">Tedavi pahalı; yine de birçok hasta onu seçiyor.</span></td><td class="small">İki ayrı cümleyi bağlar; başında noktalı virgül veya nokta, sonrasında virgül olur. however cümle ortasına da girer: It fails, however, to…</td></tr><tr><td><b>yet / but</b></td><td><code>Cümle 1, yet / but cümle 2</code></td><td>The plan was simple, <b>yet</b> it worked perfectly.<br><span class="mut small">Plan basitti ama mükemmel işledi.</span></td><td class="small">Virgülle bağlar; cümle başına gelince 'But' gayriresmidir.</td></tr><tr><td><b>even if</b></td><td><code>Even if + cümle, ana cümle (koşul + zıtlık)</code></td><td><b>Even if</b> it rains, the match will go ahead.<br><span class="mut small">Yağmur yağsa bile maç oynanacak.</span></td><td class="small">even though GERÇEK bir durumdur (yağıyor), even if VARSAYIMDIR (yağarsa bile).</td></tr></tbody></table></div><h3 style="margin-top:22px">Zıtlık · karşılaştırma (oysa)</h3><p class="mut small">İki farklı şeyi yan yana koyar; ikisi de doğrudur.</p><div class="scroll"><table class="stack"><thead><tr><th>Bağlaç</th><th>Yapı</th><th>Örnek</th><th>Not</th></tr></thead><tbody><tr><td><b>whereas / while</b></td><td><code>Cümle 1, whereas cümle 2 · While cümle 1, cümle 2</code></td><td>Some birds migrate, <b>whereas</b> others stay all year.<br><span class="mut small">Bazı kuşlar göç eder, oysa diğerleri tüm yıl kalır.</span></td><td class="small">Genellikle iki grup ya da iki özellik karşılaştırılır (some … others, A … B). while ayrıca 'iken' (zaman) anlamına da gelir: While I was reading, …</td></tr><tr><td><b>on the other hand / in contrast / by contrast / conversely</b></td><td><code>Cümle 1. In contrast, cümle 2.</code></td><td>Northern regions are rainy. <b>In contrast</b>, the south is dry.<br><span class="mut small">Kuzey bölgeleri yağışlıdır. Buna karşılık güney kurudur.</span></td><td class="small">Yeni cümle başlatır; virgülle ayrılır.</td></tr><tr><td><b>unlike</b></td><td><code>Unlike + isim, ana cümle</code></td><td><b>Unlike</b> his brother, he enjoys mathematics.<br><span class="mut small">Kardeşinin aksine o matematikten hoşlanır.</span></td><td class="small">Arkasından isim gelir, cümle gelmez.</td></tr></tbody></table></div><h3 style="margin-top:22px">Sebep (çünkü, -den dolayı)</h3><p class="mut small">Ana cümledeki durumun nedenini verir.</p><div class="scroll"><table class="stack"><thead><tr><th>Bağlaç</th><th>Yapı</th><th>Örnek</th><th>Not</th></tr></thead><tbody><tr><td><b>because / since / as / now that</b></td><td><code>Because + cümle · Since + cümle, ana cümle</code></td><td><b>Since</b> the region receives little rain, farmers use drip irrigation.<br><span class="mut small">Bölge az yağmur aldığı için çiftçiler damla sulama kullanır.</span></td><td class="small">since iki anlamlıdır: + tarih/olay ise '-den beri' (since 1990), + gerekçe ise 'çünkü'. now that = artık … olduğuna göre.</td></tr><tr><td><b>because of / due to / owing to / on account of / thanks to</b></td><td><code>Because of + isim / -ing</code></td><td>The flight was cancelled <b>owing to</b> fog.<br><span class="mut small">Uçuş sis nedeniyle iptal edildi.</span></td><td class="small">Arkasından cümle gelmez. thanks to olumlu sebep için kullanılır.</td></tr><tr><td><b>for</b></td><td><code>Cümle 1, for cümle 2 (resmî)</code></td><td>He left early, <b>for</b> he was tired.<br><span class="mut small">Erken ayrıldı, zira yorgundu.</span></td><td class="small">Sadece cümle ortasında, virgülden sonra.</td></tr></tbody></table></div><h3 style="margin-top:22px">Sonuç (bu yüzden)</h3><p class="mut small">Önceki cümle sebep, bu cümle sonuçtur.</p><div class="scroll"><table class="stack"><thead><tr><th>Bağlaç</th><th>Yapı</th><th>Örnek</th><th>Not</th></tr></thead><tbody><tr><td><b>therefore / thus / hence / consequently / as a result / accordingly</b></td><td><code>Cümle 1; therefore, cümle 2.</code></td><td>The city built new bike lanes; <b>as a result</b>, cycling doubled.<br><span class="mut small">Şehir yeni bisiklet yolları yaptı; sonuç olarak bisiklet kullanımı ikiye katlandı.</span></td><td class="small">hence ve thus isim öbeğiyle de kullanılır: …, hence the name.</td></tr><tr><td><b>so</b></td><td><code>Cümle 1, so cümle 2</code></td><td>It was late, <b>so</b> we took a taxi.<br><span class="mut small">Geç olmuştu, bu yüzden taksiye bindik.</span></td><td class="small">Virgülle bağlar; amaç bildiren 'so that' ile karıştırma.</td></tr><tr><td><b>so … that / such … that</b></td><td><code>so + sıfat/zarf + that · such (a) + sıfat + isim + that</code></td><td>The test was <b>so</b> hard <b>that</b> few passed. · It was <b>such</b> a hard test <b>that</b> few passed.<br><span class="mut small">Sınav o kadar zordu ki az kişi geçti.</span></td><td class="small">Tek sıfat → so; isim öbeği → such.</td></tr></tbody></table></div><h3 style="margin-top:22px">Amaç (-mek için)</h3><p class="mut small">Eylemin amacını verir.</p><div class="scroll"><table class="stack"><thead><tr><th>Bağlaç</th><th>Yapı</th><th>Örnek</th><th>Not</th></tr></thead><tbody><tr><td><b>so that / in order that</b></td><td><code>so that + özne + can/could/will + V1</code></td><td>She saved money <b>so that</b> she could study abroad.<br><span class="mut small">Yurt dışında okuyabilmek için para biriktirdi.</span></td><td class="small">Arkasında genellikle modal (can, could, would) olur.</td></tr><tr><td><b>in order to / so as to / to</b></td><td><code>in order to + V1</code></td><td>Farmers rotate crops <b>in order to</b> protect the soil.<br><span class="mut small">Çiftçiler toprağı korumak için ürün rotasyonu yapar.</span></td><td class="small">Olumsuzu: in order not to / so as not to + V1.</td></tr></tbody></table></div><h3 style="margin-top:22px">Koşul</h3><p class="mut small">Bir şeyin olması için gereken şartı verir.</p><div class="scroll"><table class="stack"><thead><tr><th>Bağlaç</th><th>Yapı</th><th>Örnek</th><th>Not</th></tr></thead><tbody><tr><td><b>if / unless</b></td><td><code>Unless + olumlu cümle = if … not</code></td><td>Plants die <b>unless</b> they get light.<br><span class="mut small">Bitkiler ışık almadıkça ölür.</span></td><td class="small">unless zaten olumsuzluk içerir; arkasından olumsuz cümle getirme.</td></tr><tr><td><b>provided (that) / providing / as long as / on condition that</b></td><td><code>as long as + cümle</code></td><td>You can borrow it <b>as long as</b> you return it by Friday.<br><span class="mut small">Cuma'ya kadar geri getirmen şartıyla ödünç alabilirsin.</span></td><td class="small">Hepsi 'şartıyla, yeter ki' anlamında.</td></tr><tr><td><b>in case</b></td><td><code>in case + cümle (tedbir)</code></td><td>Take an umbrella <b>in case</b> it rains.<br><span class="mut small">Yağmur yağma ihtimaline karşı şemsiye al.</span></td><td class="small">Koşul değil önlemdir; if ile aynı anlam değildir.</td></tr><tr><td><b>otherwise</b></td><td><code>Cümle 1; otherwise, cümle 2</code></td><td>Back up your files; <b>otherwise</b>, you may lose them.<br><span class="mut small">Dosyalarını yedekle; aksi halde kaybedebilirsin.</span></td><td class="small">İki cümleyi bağlar; 'aksi halde'.</td></tr></tbody></table></div><h3 style="margin-top:22px">Ekleme ve benzerlik</h3><p class="mut small">Aynı yönde yeni bilgi ekler.</p><div class="scroll"><table class="stack"><thead><tr><th>Bağlaç</th><th>Yapı</th><th>Örnek</th><th>Not</th></tr></thead><tbody><tr><td><b>moreover / furthermore / in addition / besides / also</b></td><td><code>Cümle 1. Moreover, cümle 2.</code></td><td>The plan is cheap. <b>Moreover</b>, it is easy to apply.<br><span class="mut small">Plan ucuz. Üstelik uygulaması kolay.</span></td><td class="small">Yeni cümle başlatır.</td></tr><tr><td><b>in addition to / besides / as well as / apart from</b></td><td><code>in addition to + isim / -ing</code></td><td><b>In addition to</b> teaching, she does research.<br><span class="mut small">Öğretmenliğin yanı sıra araştırma da yapıyor.</span></td><td class="small">Arkasından isim ya da -ing gelir. apart from hem 'dışında' hem 'yanı sıra' anlamına gelir.</td></tr><tr><td><b>likewise / similarly / in the same way</b></td><td><code>Cümle 1. Similarly, cümle 2.</code></td><td>Bees pollinate crops. <b>Similarly</b>, some birds spread seeds.<br><span class="mut small">Arılar ürünleri tozlaştırır. Benzer şekilde bazı kuşlar tohum yayar.</span></td><td class="small">Benzerlik; zıtlık ya da sonuç değil.</td></tr><tr><td><b>not only … but also / both … and</b></td><td><code>Not only + devrik yardımcı fiil + özne …, but (also) …</code></td><td><b>Not only</b> did the policy cut pollution, <b>but</b> it <b>also</b> created jobs.<br><span class="mut small">Politika sadece kirliliği azaltmakla kalmadı, iş de yarattı.</span></td><td class="small">Not only cümle başına gelirse devrik yapı gerekir (did the policy).</td></tr></tbody></table></div><h3 style="margin-top:22px">Örnek, açıklama, yerine</h3><p class="mut small">Örnek verir, yeniden ifade eder ya da bir şeyin yerine geçeni söyler.</p><div class="scroll"><table class="stack"><thead><tr><th>Bağlaç</th><th>Yapı</th><th>Örnek</th><th>Not</th></tr></thead><tbody><tr><td><b>for example / for instance / to illustrate</b></td><td><code>Cümle 1. For example, cümle 2.</code></td><td>Some animals use tools. <b>For instance</b>, crows bend wires into hooks.<br><span class="mut small">Bazı hayvanlar alet kullanır. Örneğin kargalar teli kanca yapar.</span></td><td class="small">Arkasından tam cümle.</td></tr><tr><td><b>such as / like</b></td><td><code>isim + such as + isim</code></td><td>Fruits <b>such as</b> oranges are rich in vitamin C.<br><span class="mut small">Portakal gibi meyveler C vitamini bakımından zengindir.</span></td><td class="small">Arkasından sadece isim gelir.</td></tr><tr><td><b>namely / that is (i.e.) / in other words</b></td><td><code>…; namely, isim/cümle</code></td><td>Two countries, <b>namely</b> Chile and Peru, signed the deal.<br><span class="mut small">İki ülke, yani Şili ve Peru, anlaşmayı imzaladı.</span></td><td class="small">Tam olarak hangileri olduğunu ya da ne demek istendiğini açıklar.</td></tr><tr><td><b>instead / instead of / rather than</b></td><td><code>Cümle 1; instead, cümle 2 · instead of + isim/-ing</code></td><td>The city did not build roads; <b>instead</b>, it improved public transport.<br><span class="mut small">Şehir yol yapmadı; onun yerine toplu taşımayı geliştirdi.</span></td><td class="small">ZITLIK DEĞİL, İKAMEDİR: A yapılmadı, B yapıldı. Sınavlarda en sık kurulan tuzak budur.</td></tr></tbody></table></div><h3 style="margin-top:22px">Zaman</h3><p class="mut small">Olayların sırasını verir.</p><div class="scroll"><table class="stack"><thead><tr><th>Bağlaç</th><th>Yapı</th><th>Örnek</th><th>Not</th></tr></thead><tbody><tr><td><b>when / while / as</b></td><td><code>While + cümle (süreç), ana cümle</code></td><td><b>While</b> they were digging, they found a coin.<br><span class="mut small">Kazı yaparlarken bir sikke buldular.</span></td><td class="small">while/as uzun süren eylemle kullanılır.</td></tr><tr><td><b>as soon as / once / the moment</b></td><td><code>Once + cümle, ana cümle</code></td><td><b>Once</b> the data were collected, analysis began.<br><span class="mut small">Veriler toplanır toplanmaz analiz başladı.</span></td><td class="small">Gelecek anlamında bile present kullanılır: Once you finish, call me.</td></tr><tr><td><b>until / by the time / before / after</b></td><td><code>By the time + past simple, past perfect</code></td><td><b>By the time</b> help arrived, the fire had spread.<br><span class="mut small">Yardım geldiğinde yangın yayılmıştı.</span></td><td class="small">by the time zaman uyumu ister (past → past perfect, present → future perfect).</td></tr><tr><td><b>since (zaman)</b></td><td><code>since + tarih / past simple cümle, present perfect</code></td><td>Prices have doubled <b>since</b> the war began.<br><span class="mut small">Savaş başladığından beri fiyatlar ikiye katlandı.</span></td><td class="small">Ana cümle present perfect olur.</td></tr></tbody></table></div><h3 style="margin-top:22px">Sık karıştırılan çiftler</h3><div class="scroll"><table class="stack"><thead><tr><th>Çift</th><th>Fark</th></tr></thead><tbody><tr><td><b>although ↔ despite</b></td><td>although + cümle · despite + isim/-ing</td></tr><tr><td><b>even though ↔ even if</b></td><td>gerçek durum ↔ varsayım</td></tr><tr><td><b>whereas ↔ although</b></td><td>whereas iki şeyi karşılaştırır (oysa) · although beklentinin tersini verir (-e rağmen)</td></tr><tr><td><b>however ↔ instead</b></td><td>however = ama · instead = onun yerine</td></tr><tr><td><b>since (çünkü) ↔ since (-den beri)</b></td><td>gerekçe + cümle ↔ tarih/olay + present perfect</td></tr><tr><td><b>so ↔ so that</b></td><td>sonuç ↔ amaç</td></tr><tr><td><b>unless ↔ in case</b></td><td>koşul (-medikçe) ↔ tedbir (ihtimaline karşı)</td></tr><tr><td><b>hence ↔ thus ↔ therefore</b></td><td>üçü de sonuç; hence isim öbeğiyle de gelir</td></tr></tbody></table></div>`,
qs:[["The new vaccine proved highly effective in trials; ----, its high cost has limited its use in poorer countries.",["therefore","nevertheless","likewise","namely","otherwise"],1,"Etkili ↔ ama pahalı: zıtlık. nevertheless = yine de."],
["Patients must take the medicine regularly; ----, the infection may return.",["otherwise","moreover","hence","similarly","instead"],0,"“Düzenli almalı, AKSİ HALDE enfeksiyon döner” → otherwise."],
["The city did not build new roads; ----, it invested heavily in public transport.",["thus","for instance","instead","nonetheless","in other words"],2,"Yol yapılmadı, onun YERİNE toplu taşımaya yatırım → instead (ikame)."],
["---- the region receives little rainfall, farmers have developed highly efficient irrigation methods.",["Since","Whereas","Unless","Despite","As if"],0,"Az yağmur → bu yüzden verimli sulama: sebep. Since = çünkü. Despite'tan sonra cümle gelmez."],
["Some species thrive in polluted water, ---- others die within days.",["so that","whereas","as long as","in case","because"],1,"İki grubu karşılaştırıyor: bazıları gelişir, oysa diğerleri ölür → whereas."],
["Early maps were often inaccurate; ----, they gave sailors a rough sense of direction.",["nonetheless","hence","namely","for instance","likewise"],0,"Hatalıydılar ↔ yine de yön veriyorlardı → zıtlık: nonetheless."]]},
{id:"edat",t:"Edatlar ve edat öbekleri",body:`
<p>Edat soruları iki türlüdür: <b>anlamdan çözülen</b> (yön, yer, araç) ve <b>kalıptan çözülen</b> (fiil/isim + edat). İkisini ayrı çalış.</p>
<h3>1 · Anlamdan çözülenler</h3>
<div class="scroll"><table class="stack"><thead><tr><th>Edat</th><th>Anlam</th><th>Örnek</th></tr></thead><tbody>
<tr><td>through</td><td>içinden geçerek; <b>aracılığıyla, sayesinde</b></td><td>through sighting the Sun = Güneşi gözlemleyerek</td></tr>
<tr><td>towards</td><td>-e doğru; -e yönelik</td><td>steer towards a coast</td></tr>
<tr><td>across</td><td>bir uçtan öbürüne, boyunca; karşısında</td><td>across the border, across Europe</td></tr>
<tr><td>along</td><td>bir çizgi boyunca</td><td>along the river</td></tr>
<tr><td>throughout</td><td>baştan sona, her yerinde</td><td>throughout the year</td></tr>
<tr><td>within</td><td>içinde, süresi/sınırı dahilinde</td><td>within 10 years</td></tr>
<tr><td>beyond</td><td>ötesinde, aşan</td><td>beyond our control</td></tr>
<tr><td>among / between</td><td>çok kişi arasında / iki şey arasında</td><td>among students · between A and B</td></tr>
</tbody></table></div>
<h3>2 · Edat öbekleri (anlamı ezberle)</h3>
<div class="scroll"><table class="stack"><thead><tr><th>Öbek</th><th>Türkçesi</th></tr></thead><tbody>
<tr><td>regardless of / irrespective of</td><td>-e bakılmaksızın, -den bağımsız olarak</td></tr>
<tr><td>on the basis of</td><td>-e dayanarak, temelinde</td></tr>
<tr><td>prior to</td><td>-den önce</td></tr>
<tr><td>in pursuit of</td><td>-in peşinde</td></tr>
<tr><td>for the sake of</td><td>-in hatırına, uğruna</td></tr>
<tr><td>at the expense of</td><td>-in pahasına</td></tr>
<tr><td>in the wake of</td><td>-in ardından</td></tr>
<tr><td>by means of</td><td>aracılığıyla</td></tr>
<tr><td>owing to / due to</td><td>yüzünden</td></tr>
<tr><td>in terms of / with regard to</td><td>açısından / ile ilgili olarak</td></tr>
</tbody></table></div>
<h3>3 · Sık kalıplar</h3>
<p>contribute <b>to</b> · rely / depend <b>on</b> · result <b>in</b> (sonuç) vs result <b>from</b> (sebep) · consist <b>of</b> · protect <b>from</b> · responsible <b>for</b> · access <b>to</b> · impact <b>on</b> · a rise <b>in</b> · demand <b>for</b> · approach <b>to</b> · accreditation <b>from</b> · linked <b>to</b>.</p>
<p><mark>Tuzak:</mark> <b>despite</b> ancak iki fikir çelişiyorsa gelir. “Ortak bir ilgi temelinde bir araya gelmek”te çelişki yok → <b>on the basis of</b>.</p>`,
qs:[["Many migrants risked their lives travelling ---- the desert ---- better opportunities.",["across / in pursuit of","along / regardless of","into / prior to","within / at the expense of","beyond / in terms of"],0,"Çölü boydan boya geçmek: across. Daha iyi fırsatların peşinde: in pursuit of."],
["All applicants are assessed ---- their academic records, ---- their nationality.",["on the basis of / irrespective of","for the sake of / owing to","in pursuit of / by means of","prior to / along with","in terms of / in the wake of"],0,"Akademik kayıtlarına DAYANARAK, uyruklarına BAKILMAKSIZIN."],
["Heavy industry has grown rapidly in the region, but often ---- the environment.",["at the expense of","in accordance with","prior to","on behalf of","by means of"],0,"“but” zıtlık kuruyor: büyüme çevrenin PAHASINA oldu."],
["The disease is highly contagious and spreads quickly ---- crowded refugee camps.",["beyond","throughout","towards","apart from","onto"],1,"Kampların her yerine/baştan sona yayılır → throughout."],
["Exposure to sunlight contributes ---- the production of vitamin D in the skin.",["for","at","to","with","on"],2,"Kalıp: contribute TO."],
["The results of the survey will be published ---- three months of its completion.",["within","along","among","across","towards"],0,"Tamamlanmasından itibaren üç ay İÇİNDE → within."]]},
{id:"zaman",t:"Zamanlar (tense uyumu)",body:`
<p>İki boşluklu tense sorularında önce <b>zaman ifadesini</b> bul. Seçeneklerin yarısı onunla elenir.</p>
<div class="scroll"><table class="stack"><thead><tr><th>İpucu</th><th>Zaman</th><th>Örnek</th></tr></thead><tbody>
<tr><td>since 1990, for years, so far, over the past decade, recently</td><td>Present perfect</td><td>has risen</td></tr>
<tr><td>until recently, in 1990, ago, last year</td><td>Past simple</td><td>was overlooked</td></tr>
<tr><td>by the time + past simple</td><td>Past perfect</td><td>had lost</td></tr>
<tr><td>by the time + present / by 2040</td><td>Future perfect</td><td>will have provided</td></tr>
<tr><td>genel doğru, bilimsel gerçek</td><td>Present simple</td><td>water boils</td></tr>
<tr><td>currently, at present, nowadays</td><td>Present simple / continuous</td><td>is increasing</td></tr>
</tbody></table></div>
<p><mark>Kural:</mark> Sonuç bugün geçerliyse ve tarih yoksa <b>present perfect</b> (has been proven); geçmişte bitmiş bir dönemse <b>past</b> (was overlooked until recently).</p>`,
qs:[["Since the 1990s, the number of women in higher education ---- dramatically.",["rises","has risen","had risen","was rising","will rise"],1,"since + tarih → present perfect."],
["By the time the ambulance ----, the patient ---- consciousness.",["arrived / had lost","arrives / has lost","had arrived / lost","was arriving / loses","arrives / had lost"],0,"by the time + past simple → ana cümle past perfect."],
["Until recently, scientists ---- that the adult brain ---- new cells.",["believe / cannot produce","have believed / can produce","believed / could not produce","had believed / will not produce","were believing / does not produce"],2,"until recently → past simple; geçmişteki inanç → could not."],
["By 2040, renewable sources ---- more than half of the world's electricity.",["will have provided","have provided","provided","had provided","are providing"],0,"by + gelecek tarih → future perfect."],
["The ancient city ---- by an earthquake in 365 AD and ---- never fully rebuilt.",["has been destroyed / is","was destroyed / was","had destroyed / has been","is destroyed / had been","destroyed / will be"],1,"Belirli geçmiş tarih (365 AD) → past simple passive, ikisi de."]]},
{id:"pasif",t:"Passive ve to / -ing yapıları",body:`
<div class="scroll"><table class="stack"><thead><tr><th>Yapı</th><th>Aktif</th><th>Pasif</th></tr></thead><tbody>
<tr><td>Present / past</td><td>they build</td><td>is built / was built</td></tr>
<tr><td>Perfect</td><td>have built</td><td>has been built</td></tr>
<tr><td>Modal</td><td>can build</td><td>can be built</td></tr>
<tr><td>Infinitive</td><td>to build</td><td><b>to be built</b></td></tr>
<tr><td>Gerund</td><td>building</td><td><b>being built</b></td></tr>
<tr><td>Perfect infinitive</td><td>to have built</td><td>to have been built</td></tr>
</tbody></table></div>
<p><mark>YDS'nin sevdiği kalıp:</mark> <b>X is said / believed / expected / predicted + to V1</b> (şimdi/gelecek) ya da <b>to have V3</b> (geçmiş). “Robots are predicted <b>to perform</b> tasks” — tahmin bugün, iş gelecekte.</p>
<p><b>be seen / regarded / considered as</b> = olarak görülmek (genel görüş → present simple: is seen).</p>
<p><b>Nesne + to:</b> require, allow, enable, encourage, force, expect + someone <b>to do</b> / <b>to be done</b>.<br><b>-ing alanlar:</b> avoid, involve, consider, risk, deny, be at risk of, be capable of.</p>`,
qs:[["The new bridge is expected ---- by the end of next year.",["completing","to complete","to be completed","being completed","to have completed"],2,"Köprü tamamlanacak (kendisi tamamlamaz) + expected to → to be completed."],
["Dinosaurs are believed ---- out about 66 million years ago.",["to die","to have died","dying","to be died","having been died"],1,"İnanç bugün, olay geçmişte → to have V3."],
["The law requires all drivers ---- a seat belt.",["wearing","wear","to wear","to be worn","worn"],2,"require + someone + to V1."],
["Many old buildings in the area are at risk of ---- by developers.",["demolishing","being demolished","to be demolished","demolished","to demolish"],1,"Edattan (of) sonra -ing; binalar yıkılır → being demolished."],
["The documents ---- carefully before they ---- to the public.",["must be checked / are released","must check / release","have checked / were released","checked / will release","are checking / have been released"],0,"Belgeler kontrol edilir ve yayımlanır: iki pasif; zaman cümlesinde gelecek için present."]]},
{id:"modal",t:"Modal ve perfect modal",body:`
<div class="scroll"><table class="stack"><thead><tr><th>Anlam</th><th>Şimdi / genel</th><th>Geçmiş</th></tr></thead><tbody>
<tr><td>Olasılık</td><td>may / might / could + V1</td><td>may / might / could have V3</td></tr>
<tr><td>Yetenek / genel kapasite</td><td>can + V1</td><td>could + V1, was able to</td></tr>
<tr><td>Güçlü çıkarım (kesin öyle)</td><td>must + V1</td><td>must have V3</td></tr>
<tr><td>İmkânsızlık</td><td>can't + V1</td><td>can't / couldn't have V3</td></tr>
<tr><td>Tavsiye / eleştiri</td><td>should + V1</td><td>should have V3 (yapmalıydı, yapmadı)</td></tr>
<tr><td>Gereksizlik</td><td>needn't + V1</td><td>needn't have V3 (yaptı ama gerek yoktu)</td></tr>
<tr><td>Fırsat kaçtı</td><td>—</td><td>could have V3 (yapabilirdi, yapmadı)</td></tr>
</tbody></table></div>
<p><mark>Yöntem:</mark> Cümlede geçmiş bir olay var mı? Yoksa perfect modal (must have …) elenir. “İddia: tramvay şehri canlandır<b>abilir</b>; araştırma: tersi ol<b>abilir</b>” → can regenerate / may happen.</p>`,
qs:[["The lights in the office are off; everyone ---- home already.",["should have gone","must have gone","can go","needn't have gone","would go"],1,"Kanıta dayalı güçlü çıkarım, geçmiş → must have gone."],
["The disaster ---- if the warning signs had been taken seriously.",["must be avoided","could have been avoided","should avoid","may avoid","can be avoided"],1,"Geçmişteki kaçırılmış fırsat + pasif → could have been avoided."],
["You ---- bring your own laptop; computers are provided in the exam hall.",["mustn't","needn't","couldn't","shouldn't have","might"],1,"Gerek yok → needn't. mustn't = yasak."],
["The ancient tools are so simple that they ---- by the earliest human species.",["may have been made","should make","must make","can have made","would be making"],0,"Geçmiş + olasılık + pasif (aletler yapılır) → may have been made."],
["The government ---- in flood defences years ago; now the costs are much higher.",["must have invested","should have invested","may have invested","can't have invested","needn't have invested"],1,"Eleştiri: yapmalıydı ama yapmadı → should have V3."]]},
{id:"relative",t:"Relative ve noun clause",body:`
<div class="scroll"><table class="stack"><thead><tr><th>Bağlaç</th><th>Kullanım</th><th>Örnek</th></tr></thead><tbody>
<tr><td>who / which / that</td><td>kişi / şey; virgülden sonra <b>that olmaz</b></td><td>the zones, which were created…</td></tr>
<tr><td>whose</td><td>-in (sahiplik) + isim</td><td>a city whose history…</td></tr>
<tr><td>where / when</td><td>yer / zaman (= in which)</td><td>the village where I grew up</td></tr>
<tr><td>some / most of which / whom</td><td>“onlardan bazısı”</td><td>zones, some of which are located…</td></tr>
<tr><td>edat + which/whom</td><td>edat başa gelince that olmaz</td><td>the state in which they live</td></tr>
<tr><td>what</td><td>= the thing that; önünde isim olmaz</td><td>What surprised us was…</td></tr>
<tr><td>whether</td><td>-ip -mediği</td><td>It is unclear whether…</td></tr>
</tbody></table></div>`,
qs:[["The researchers interviewed 200 teachers, most of ---- had over ten years of experience.",["them","which","whom","who","whose"],2,"Kişi + edat (of) → whom. 'them' iki cümleyi bağlayamaz."],
["Istanbul is a city ---- history stretches back thousands of years.",["where","which","whose","that","when"],2,"şehrin tarihi → sahiplik → whose."],
["---- surprised the scientists was the speed of the change.",["That","What","Which","Whether","It"],1,"Öznesi olmayan isim cümlesi: 'bilim insanlarını şaşırtan şey' → What."],
["It is still unclear ---- the new policy will reduce unemployment.",["whether","which","what","whose","where"],0,"azaltıp azaltmayacağı belirsiz → whether."],
["The village ---- I grew up has changed completely.",["which","in which","whose","that","of which"],1,"grow up IN the village → in which (= where)."]]},
{id:"if",t:"If clause, unless, devrik yapılar",body:`
<div class="scroll"><table class="stack"><thead><tr><th>Tür</th><th>If cümlesi</th><th>Ana cümle</th></tr></thead><tbody>
<tr><td>Type 1 (gerçek)</td><td>present</td><td>will / can / may + V1</td></tr>
<tr><td>Type 2 (hayalî, şimdi)</td><td>past (were)</td><td>would / could + V1</td></tr>
<tr><td>Type 3 (hayalî, geçmiş)</td><td>had V3</td><td>would / could have V3</td></tr>
<tr><td>Devrik</td><td>Had it…, Were it…, Should you…</td><td>if düşer, yardımcı fiil başa</td></tr>
</tbody></table></div>
<p><b>unless</b> = if … not · <b>provided (that) / as long as</b> = şartıyla · <b>in case</b> = ihtimaline karşı · <b>even if</b> = -se bile · <b>but for / were it not for</b> = olmasaydı.</p>`,
qs:[["If governments ---- more in education, poverty rates would fall.",["invest","invested","had invested","will invest","have invested"],1,"would fall → Type 2 → past simple."],
["---- the warning been issued earlier, many lives could have been saved.",["If","Were","Had","Should","Unless"],2,"Type 3 devrik: Had + özne + V3."],
["Plants cannot survive ---- they receive enough light.",["unless","provided that","as long as","so that","even if"],0,"yeterli ışık ALMADIKÇA yaşayamaz → unless."],
["---- it not for international aid, the country's economy would collapse.",["Had","Were","Should","If","Unless"],1,"Şimdiye dair: Were it not for = olmasaydı."],
["You can borrow the book ---- you return it by Friday.",["unless","as long as","in case","whereas","even though"],1,"Cuma'ya kadar getirmen ŞARTIYLA → as long as."]]},
{id:"karsilastirma",t:"Karşılaştırma ve paralel yapılar",body:`
<div class="scroll"><table class="stack"><thead><tr><th>Yapı</th><th>Anlam</th></tr></thead><tbody>
<tr><td>not only … but also</td><td>sadece … değil, aynı zamanda</td></tr>
<tr><td>both … and / either … or / neither … nor</td><td>hem … hem / ya … ya / ne … ne</td></tr>
<tr><td>the + comparative …, the + comparative</td><td>ne kadar …, o kadar …</td></tr>
<tr><td>so + sıfat + that / such (a) + sıfat + isim + that</td><td>o kadar … ki</td></tr>
<tr><td>as … as / not as … as</td><td>kadar / kadar değil</td></tr>
<tr><td>too … to / … enough to</td><td>-emeyecek kadar / yetecek kadar</td></tr>
<tr><td>No sooner … than / Hardly … when</td><td>-ir -irmez</td></tr>
</tbody></table></div>
<p><mark>Hızlı eleme:</mark> Boşluktan sonra <b>isim öbeği</b> varsa such, <b>tek sıfat</b> varsa so.</p>`,
qs:[["The more you study vocabulary in context, ---- you will understand academic texts.",["the more easily","so easily","not only easily","such easily","either easily"],0,"The more …, the more … yapısı."],
["The test was ---- difficult ---- only a few students passed.",["such / that","so / that","as / as","too / to","more / than"],1,"Tek sıfat (difficult) → so … that."],
["The new policy benefits ---- employers ---- employees.",["neither / or","both / and","either / nor","as / than","whether / and"],1,"Hem … hem → both … and."],
["It was ---- a complex problem ---- nobody could solve it quickly.",["so / that","such / that","too / to","as / as","enough / to"],1,"a + sıfat + isim → such … that."],
["No sooner had the results been announced ---- protests began.",["when","than","that","then","as"],1,"No sooner … than."]]}
];

{id:"r1",f:"Psikoloji",t:"The quiet strength of resilience",x:`For decades, psychologists assumed that people who experienced a major loss or trauma would inevitably suffer long-term damage. Research conducted over the past twenty years, however, has challenged this view. Studies following people after bereavement, natural disasters and serious illness show that a substantial proportion of them, often more than half, return to their previous level of functioning within a year or two. This capacity, known as resilience, was once regarded as a rare trait possessed by exceptional individuals. Today, it is increasingly seen as an ordinary process that relies on everyday resources: supportive relationships, a sense of control and the ability to regulate emotions. Importantly, resilience does not mean the absence of distress. Resilient people still feel sadness and anxiety; what distinguishes them is that these feelings do not prevent them from functioning for prolonged periods. Some researchers warn, though, that the popularity of the concept carries a risk. If resilience is presented merely as a personal skill, the social conditions that make recovery harder, such as poverty or isolation, may be overlooked.`,

{id:"r2",f:"Kent planlama",t:"Trams and the city",x:`Across Europe, many cities that pulled down their tram networks in the mid-twentieth century are now rebuilding them. Supporters argue that trams can regenerate declining city centres: they carry large numbers of passengers without the local pollution of diesel buses, and their fixed tracks signal a long-term public commitment that encourages private investment along the route. Studies from France, where many cities have opened new lines since the 1980s, appear to support this claim, showing rising property values and new shops near tram stops. Yet the picture is not entirely positive. Construction often takes several years, during which small businesses along the route may lose customers and even close. In some cases, the rise in property values has pushed low-income residents out of the very neighbourhoods the projects were meant to revive. Critics also point out that a tram is only as effective as the wider transport system it belongs to. Without well-connected bus routes, safe cycling lanes and limits on private car use, a new tram line may simply become an expensive symbol rather than a genuine solution.`,

["According to supporters, fixed tram tracks ----.",["reduce construction time","encourage private investment by signalling commitment","are cheaper than bus routes","lower property values","remove the need for cycling lanes"],1,"“fixed tracks signal a long-term public commitment that encourages private investment”"],

{id:"r3",f:"Sosyoloji",t:"The disappearing third place",x:`The sociologist Ray Oldenburg used the term “third places” to describe informal public gathering spots, such as cafés, barbershops, libraries and parks, that are distinct from home, the first place, and work, the second. In such places, people meet on neutral ground, conversation is the main activity, and social status matters less than it does in the workplace. Oldenburg argued that third places foster a sense of belonging and serve as the grassroots of democracy, since they allow citizens to exchange views and build trust regardless of their background. In recent decades, however, many observers have noted a decline in such spaces. Suburban development, longer working hours and the rise of home entertainment have reduced the time and opportunity people have for casual encounters. Some researchers suggest that online communities now act as digital third places, offering conversation and a sense of community. Others remain sceptical, arguing that online platforms, which are designed to maximise attention and often sort users into like-minded groups, cannot fully replace the unplanned, face-to-face mixing that physical spaces provide.`,

["According to Oldenburg, third places contribute to democracy because ----.",["they are funded by the state","they let people of different backgrounds exchange views and build trust","politicians often visit them","they replace elections","social status is very important there"],1,"exchange views and build trust regardless of their background."],

{id:"r4",f:"Tıp",t:"A warning that came true",x:`When penicillin became widely available in the 1940s, it was hailed as a miracle drug, and infections that had once been fatal became easily treatable. Yet Alexander Fleming, who had discovered the substance, warned that its misuse could produce resistant bacteria. His prediction has come true. Bacteria reproduce rapidly, and every time an antibiotic is used, the few cells that happen to survive can pass on their resistance to the next generation. The overuse of antibiotics in human medicine, for example prescribing them for viral infections against which they have no effect, has accelerated this process. Agriculture plays an equally significant role, as large quantities of antibiotics have been given to healthy farm animals to promote growth. As a result, some common infections are becoming harder to treat, and health authorities warn that routine operations could become far more dangerous. Developing new antibiotics is one possible remedy, but pharmaceutical companies have shown reluctance to invest, since new drugs would be used sparingly to delay resistance and would therefore generate little profit.`,

["Pharmaceutical companies are reluctant to develop new antibiotics because ----.",["antibiotics are too easy to develop","new drugs would be used sparingly and earn little profit","bacteria no longer cause infections","governments have banned the research","farm animals no longer need them"],1,"used sparingly → little profit."],

{id:"r5",f:"Bilim tarihi",t:"Finding the way at sea",x:`For most of history, sailors could determine their latitude, their position north or south of the equator, with reasonable accuracy. By measuring the angle of the Sun at noon or of the North Star at night, they could tell how far north or south they were. Longitude, their east–west position, was a far more difficult problem. Because the Earth rotates fifteen degrees every hour, calculating longitude required knowing the exact time at a reference point while at sea, and the pendulum clocks of the period were useless on a moving ship. Errors could be disastrous: in 1707, several British warships ran aground off the Isles of Scilly, and well over a thousand sailors died. In 1714, the British government offered a large prize for a practical solution. Many astronomers favoured a method based on the position of the Moon, but the breakthrough came from John Harrison, a self-taught clockmaker, whose marine timekeepers kept accurate time despite the motion of the ship and changes in temperature. Although he struggled for years to receive full recognition from the authorities, his invention eventually transformed navigation.`,

["The 1707 disaster is mentioned in order to ----.",["praise the British navy","illustrate the serious consequences of navigation errors","explain how latitude was measured","criticise Harrison","describe the weather near Scilly"],1,"Errors could be disastrous: örnek."],

{id:"r6",f:"Teknoloji ve ekonomi",t:"Will robots take our jobs?",x:`Predictions about robots replacing human workers are hardly new. In the 1960s, commentators warned that automation would soon lead to mass unemployment, yet employment continued to grow in most industrialised countries. Today's forecasts are based on far more sophisticated machines that can not only perform physical tasks but also recognise images, process language and make simple decisions. Some studies estimate that a large share of current jobs involve tasks that could, in principle, be automated within the next two decades. Economists, however, caution against reading such estimates too literally. A job is usually a bundle of different tasks, and automating some of them often changes the nature of the job rather than eliminating it. Bank tellers offer a familiar example: the spread of cash machines did not make them disappear immediately, since the cost savings allowed banks to open more branches, and tellers increasingly focused on customer service. The greater risk, many argue, is not that work will vanish but that its benefits will be distributed unevenly, with highly skilled workers gaining while those in routine jobs see their wages stagnate.`,

["Despite repeated warnings, the government failed to take ---- action, and the crisis spread rapidly.",["prompt","remote","mediocre","coincidental","humane"],0,"prompt action = gecikmeden alınan önlem; kriz hızla yayıldı → hızlı davranılmadı."],

["The drought has had a(n) ---- effect on crop yields, forcing the country to import more grain.",["adverse","beneficial","negligible","abundant","voluntary"],0,"adverse = olumsuz. Tahıl ithalatı zorunluluğu olumsuz etkiyi gösterir."],

["Rising sea levels pose a serious ---- to low-lying coastal cities.",["threat","remedy","consensus","incentive","breakthrough"],0,"pose a threat = tehdit oluşturmak (kalıp)."],
["The professor's lectures were so ---- that students often struggled to follow the main argument.",["convoluted","concise","lucid","straightforward","coherent"],0,"convoluted = karmaşık, dolambaçlı. Diğerleri 'anlaşılır' anlamında, ters."],
["In many cultures, elderly people are ---- for their wisdom and experience.",["revered","deprived","scorned","neglected","exploited"],0,"revere = saygı duymak, yüceltmek."],

ybaglac:{t:"YDS tipi bağlaç",d:"Zıtlık mı, sebep mi, sonuç mu? Önce ilişkiyi Türkçe söyle.",mix:1,qs:[
["Coffee has been linked to a lower risk of certain diseases; ----, experts warn that excessive intake can cause sleep problems.",["however","therefore","for instance","similarly","namely"],0,"Yararlı ↔ ama aşırısı zararlı: zıtlık."],

["The theory explains some observations well; it fails, ----, to account for others.",["however","therefore","for example","in other words","moreover"],0,"İyi açıklıyor ↔ başarısız: zıtlık; however cümle ortasında da gelir."],
["The experiment will only be valid ---- all variables are carefully controlled.",["as long as","unless","even though","whereas","in case"],0,"…ŞARTIYLA geçerli → as long as."],

cumle:{t:"Cümle tamamlama",d:"Bağlacın kurduğu ilişkiye ve zaman uyumuna bak.",qs:[
["Although the internet has made information more accessible than ever, ----.",["many people now read the news on their phones","it has also made it harder to distinguish reliable sources from false ones","libraries were the main source of knowledge in the past","search engines rank pages by popularity","the first website was created in 1991"],1,"Although → zıtlık: erişim kolaylaştı AMA güvenilirliği ayırt etmek zorlaştı."],
["----, the patient's condition improved remarkably within a week.",["Unless the doctors change the treatment","Once the correct diagnosis had been made","Even if the hospital is overcrowded","Whereas the symptoms are common","So that the medicine could be tested"],1,"Ana cümle geçmiş ve olumlu; doğru tanı konduktan sonra → Once + past perfect."],
["The more people rely on navigation apps, ----.",["the less they use their own spatial memory","they had better maps","so they often got lost","as cities grow larger","which is very useful"],0,"The more …, the less … paralel yapı."],
["Children who grow up in bilingual homes ----, which may give them an advantage in certain cognitive tasks.",["are rarely exposed to more than one culture","often learn to switch attention between languages with ease","tend to start school later than other children","should be encouraged to read more books","find foreign films difficult to follow"],1,"'which' bir avantajı işaret ediyor; sadece B bilişsel avantajla mantıklı."],
["Unless urgent measures are taken to protect coral reefs, ----.",["many tourists visited them last year","a large proportion of them could disappear within decades","they had been formed over thousands of years","scientists have studied them since the 1950s","the ocean was warmer in the past"],1,"Unless (Type 1) → gelecek/olasılık: could disappear."],
["Just as the printing press changed the way knowledge spread in the fifteenth century, ----.",["books were very expensive at that time","digital media is transforming how information is shared today","Gutenberg was born in Germany","few people could read","newspapers had not yet appeared"],1,"Just as = tıpkı … gibi: benzer bir dönüşüm gerekir."],
["While some economists believe that raising the minimum wage reduces poverty, ----.",["the minimum wage was introduced in many countries","others argue that it may lead employers to hire fewer workers","poverty is a global problem","wages have increased since 2000","because workers need higher incomes"],1,"While (zıtlık) + some … → others …"],
["---- that the government decided to postpone the reform.",["The opposition was so strong","Although the public supported it","Such the protests were","The economy grew rapidly","Because the plan was popular"],0,"so + sıfat + that yapısı."]]},
ceviri:{t:"Çeviri",d:"Önce ana yapıyı (zaman, olumsuzluk, karşılaştırma) eşle, sonra ayrıntıyı.",qs:[
["<b>EN → TR</b><br>Despite growing evidence of its benefits, regular physical activity remains uncommon among office workers.",["Ofis çalışanları arasında düzenli fiziksel aktivite, yararları kanıtlandıkça yaygınlaşmaktadır.","Yararlarına ilişkin kanıtlar giderek artmasına rağmen, düzenli fiziksel aktivite ofis çalışanları arasında yaygın olmamayı sürdürmektedir.","Ofis çalışanları, düzenli fiziksel aktivitenin yararlarını gösteren kanıtlara inanmamaktadır.","Yararlarına ilişkin kanıtlar artmasaydı, ofis çalışanları arasında düzenli egzersiz daha da az görülürdü.","Ofis çalışanlarının çoğu, yararları kanıtlanmış olsa bile düzenli fiziksel aktiviteyi gereksiz bulmaktadır."],1,"despite = -e rağmen; remains uncommon = yaygın olmamayı sürdürür."],
["<b>EN → TR</b><br>It was not until the nineteenth century that scientists began to understand how diseases are transmitted.",["Bilim insanları on dokuzuncu yüzyıla kadar hastalıkların nasıl bulaştığıyla ilgilenmediler.","Bilim insanları hastalıkların nasıl bulaştığını ancak on dokuzuncu yüzyılda anlamaya başladılar.","On dokuzuncu yüzyılda bilim insanları hastalıkların bulaşma yollarını tamamen anlamıştı.","Hastalıkların nasıl bulaştığı on dokuzuncu yüzyıldan beri araştırılmaktadır.","On dokuzuncu yüzyıldan önce bilim insanları hastalıkların bulaştığına inanmıyordu."],1,"It was not until X that … = ancak X'te …"],
["<b>EN → TR</b><br>The more a species depends on a single food source, the more vulnerable it becomes to environmental change.",["Tek bir besin kaynağına bağımlı türler, çevresel değişimlerden en çok etkilenen türlerdir.","Çevresel değişim, türlerin tek bir besin kaynağına daha bağımlı olmasına yol açar.","Bir tür tek bir besin kaynağına ne kadar çok bağımlıysa, çevresel değişime karşı o kadar savunmasız hâle gelir.","Bir türün savunmasızlığı arttıkça tek bir besin kaynağına bağımlılığı da artar.","Çevresel değişime karşı savunmasız türler genellikle birden fazla besin kaynağı kullanır."],2,"the more … the more = ne kadar … o kadar; neden-sonuç yönü korunmalı (D ters çevirmiş)."],
["<b>EN → TR</b><br>Had the bridge been inspected regularly, the collapse could have been prevented.",["Köprü düzenli olarak denetlendiği için çökme önlenebildi.","Köprünün çökmesini önlemek için düzenli denetlenmesi gerekir.","Köprü düzenli olarak denetlense bile çökme önlenemezdi.","Köprü düzenli olarak denetlenmiş olsaydı, çökme önlenebilirdi.","Köprü çöktükten sonra düzenli denetimlerin önemi anlaşıldı."],3,"Had … been V3 = devrik Type 3: -miş olsaydı … -ebilirdi."],
["<b>TR → EN</b><br>Uzmanlara göre, sosyal medya kullanımı ile kaygı düzeyi arasındaki ilişki sanıldığından daha karmaşıktır.",["Experts assume that social media use causes complex levels of anxiety.","According to experts, the relationship between social media use and anxiety levels is more complex than is commonly assumed.","According to experts, social media use is not as closely related to anxiety as it is thought.","Experts have found a complex relationship between anxiety and social media, which is commonly used.","The relationship between social media and anxiety, according to experts, is assumed to be simple."],1,"sanıldığından daha karmaşık = more complex than is commonly assumed."],
["<b>TR → EN</b><br>Yeni yasa, işverenlerin çalışanlarına esnek çalışma saatleri sunmasını zorunlu kılmaktadır.",["Employers are encouraged by the new law to give flexible hours to some employees.","Under the new law, employees can demand flexible hours from their employers.","The new law requires employers to offer their employees flexible working hours.","The new law allows employers to offer flexible working hours if they wish.","Flexible working hours, which employers offer, are regulated by the new law."],2,"zorunlu kılmak = require someone to do."],
["<b>TR → EN</b><br>Araştırmacılar, deneyin sonuçlarını yayımlamadan önce verileri birkaç kez kontrol ettiler.",["The researchers published the results after the data had been checked by others.","Before the experiment, the data was checked several times by the researchers.","The researchers checked the data several times prior to publishing the results of the experiment.","The researchers had to check the data again because the results were published.","After checking the data once, the researchers published the experiment's results."],2,"yayımlamadan önce = prior to publishing."],
["<b>TR → EN</b><br>Ekonomik büyüme, çevrenin pahasına gerçekleşmemelidir.",["The environment should not be harmed by economic growth that has already taken place.","Economic growth cannot happen without damaging the environment.","The environment is more important than economic growth for future generations.","Economic growth should not take place at the expense of the environment.","Economic growth must be achieved in order to protect the environment."],3,"pahasına = at the expense of; -memelidir = should not."]]},
paragraf:{t:"Paragraf tamamlama",d:"Boşluktan önceki ve sonraki cümleyle bağ kuran seçeneği bul; zamir ve bağlaçlar ipucudur.",qs:[
["Honeybees communicate the location of food sources through a remarkable “waggle dance”. ---- The angle of the dance relative to the vertical indicates the direction of the food relative to the Sun, while the duration of the waggle shows its distance. Other bees follow the dancer closely and then fly directly to the source.",["Bees are important pollinators of many crops.","By performing this dance inside the hive, a returning forager tells her nestmates both where and how far to fly.","Honey has been used as a medicine since ancient times.","Some bee species live alone rather than in colonies.","Pesticides are a major threat to bee populations."],1,"Sonraki cümle dansın yön ve mesafeyi nasıl gösterdiğini açıklıyor; B köprü kuruyor."],
["Many cities are experimenting with car-free zones in their historic centres. Supporters say such zones reduce pollution and accidents, and that local shops benefit from increased foot traffic. Shopkeepers, however, often oppose such schemes at first. ----",["They fear that customers who arrive by car will go elsewhere.","Air pollution is linked to many diseases.","Historic centres were built long before cars existed.","Cycling is becoming more popular among young people.","Public transport fares have risen in many cities."],0,"Esnaf neden karşı çıkıyor? Sebebini veren cümle: A."],
["---- Researchers gave one group of participants a list of words to memorise and asked them to sleep, while another group stayed awake. When tested twelve hours later, the group that had slept recalled significantly more words.",["Sleep appears to play an important role in strengthening newly learned information.","Many students study late at night before exams.","Caffeine reduces the need for sleep.","Memory declines with age in most people.","Dreams have fascinated philosophers for centuries."],0,"Paragrafın ana fikri (konu cümlesi) başa gelir; deney onu destekliyor."],
["Traditional economics assumed that people make rational choices that maximise their own benefit. Behavioural economists, however, have shown that decisions are often shaped by habits, emotions and the way options are presented. ---- This tendency, known as the “default effect”, has been used by governments to increase participation in pension schemes.",["Economists have long disagreed about the causes of inflation.","For example, people are far more likely to stay in a scheme they are automatically enrolled in than to join one they must actively choose.","Rational choice theory was developed in the eighteenth century.","Emotions are studied mainly by psychologists.","Pension schemes are expensive for governments to run."],1,"“This tendency” bir önceki cümlede anlatılan eğilimi işaret ediyor: otomatik kayıt örneği."]]},
bozan:{t:"Anlam bütünlüğünü bozan cümle",d:"Konu aynı görünse bile akışı koparan, farklı bir yöne giden cümleyi bul.",qs:[
["(I) Urban gardens have become increasingly popular in large cities over the past decade. (II) They provide residents with fresh produce and an opportunity to spend time outdoors. (III) In addition, they can strengthen community ties as neighbours work together. (IV) The Hanging Gardens of Babylon are traditionally counted among the Seven Wonders of the Ancient World. (V) Some studies have also found that such gardens reduce stress among participants.",["I","II","III","IV","V"],3,"Konu kent bahçelerinin faydaları; Babil bahçeleri alakasız tarih bilgisi."],
["(I) Volcanic eruptions can have a significant effect on global climate. (II) When a large eruption occurs, it injects sulphur dioxide high into the atmosphere. (III) Volcanoes are also found on other planets, such as Mars. (IV) This gas forms tiny particles that reflect sunlight back into space. (V) As a result, average global temperatures may fall for a year or two.",["I","II","III","IV","V"],2,"II–IV–V bir neden-sonuç zinciri; III araya giriyor. IV'teki 'This gas' II'ye bağlanıyor."],
["(I) Learning a second language in adulthood is often considered more difficult than learning it as a child. (II) Adults, however, have certain advantages, such as better study strategies and a larger vocabulary in their first language. (III) Children typically acquire native-like pronunciation more easily. (IV) Many universities require students to submit a foreign language certificate. (V) Thus, while children may excel in accent, adults can often progress faster in grammar and vocabulary in the early stages.",["I","II","III","IV","V"],3,"Metin çocuk–yetişkin karşılaştırması; üniversite şartı konudan sapıyor."],
["(I) Plastic pollution in the oceans has become one of the most pressing environmental issues. (II) Every year, millions of tonnes of plastic enter the sea through rivers and coastal areas. (III) Plastic was first developed in the late nineteenth century as a substitute for natural materials such as ivory. (IV) Once in the water, it breaks down into tiny fragments known as microplastics. (V) These particles are swallowed by marine animals and can eventually enter the human food chain.",["I","II","III","IV","V"],2,"Akış: plastik denize girer → parçalanır → besin zincirine girer. Plastiğin icadı tarihi akışı bozuyor."]]},
yakin:{t:"Yakın anlamlı cümle",d:"Anlamı birebir koruyan seçeneği bul; abartan, tersine çeviren ya da bilgi ekleyen seçenekler elenir.",qs:[
["Hardly had the meeting started when the fire alarm went off.",["The fire alarm went off just after the meeting had started.","The meeting started after the fire alarm went off.","The fire alarm hardly ever went off during meetings.","The meeting was cancelled because of a fire alarm.","Nobody heard the fire alarm when the meeting started."],0,"Hardly … when = -ir -irmez."],

      <div class="row"><button id="say">Dinle</button>${open?`<button id="no">Tekrar et</button><button class="pri" id="yes">Biliyorum</button>`:`<button class="pri" id="flip">Anlamı göster</button>`}<span class="mut small">${i+1}/${deck.length} · kutu ${S.box[w.w]||0}</span></div>`;
      const fl=()=>{open=true;show()};
      document.getElementById("fc").onclick=()=>{if(!open)fl()};
      const f=document.getElementById("flip");if(f)f.onclick=fl;
      document.getElementById("say").onclick=()=>{try{const u=new SpeechSynthesisUtterance(w.w+(w.e?". "+w.e:""));u.lang="en-GB";speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}};

      if(n)n.onclick=()=>{S.box[w.w]=0;save();deck.push(w);i++;open=false;show()};
    };show();
  }
}

function synD(w,anti){

  const o=shuf([...new Set([...pool,ans])]).slice(0,5);if(!o.includes(ans))o[0]=ans;
  return{id:"d"+(anti?"z":"e")+"-"+w.w,stem:`<b style="font-size:22px">${w.w}</b> <span class="mut">(${w.p}) · ${w.t}</span><br>${anti?"Zıt anlamlısı":"Eş ya da yakın anlamlısı"} hangisidir?`,o,a:o.indexOf(ans),ex:`<b>${w.w}</b> → eş: ${w.s||"—"} · zıt: ${w.a||"—"}`,tag:anti?"Zıt anlam":"Eş anlam",tr:w.e+" — "+w.et}}

  const bandTxt={temel:"Önce kolay puanları topla: kelime, gramer, diyalog, yakın anlam ve cümle tamamlama. Okumada 5 metnin en kolay 3'üne odaklan, kalanlarda eleme yap.",orta:"Gramer, cloze ve cümle tamamlamada hata payını düşür; okumada 4–5 metni bitirecek hıza ulaş. Çeviri ve paragraf tamamlama puan farkı yaratır.",yuksek:`Hiçbir bölümü bırakma: okumada 20 sorunun en az ${c.t.okuma}'ü, gramer ve cloze'da en fazla 2–3 hata. Kelime dağarcığı 3.500+ olmalı; haftada en az bir tam ÖSYM sınavı çöz.`}[c.band];
  document.getElementById("pout").innerHTML=`
  <div class="card xhero"><div class="pstat"><div><b>${p.target}</b><span>hedef puan</span></div><div><b>${c.need}</b><span>doğru gerekir (80'de)</span></div><div><b>${c.days}</b><span>gün kaldı</span></div><div><b>${S.goal}</b><span>soru / gün hedefi</span></div></div>
  <p class="small" style="margin:.6em 0 0">${bandTxt}</p>${intensity?`<p class="small" style="margin:.4em 0 0">${intensity}</p>`:""}</div>
  <h2>Hangi bölümden kaç doğru?</h2><p class="small mut">Kolay puanlar önce: diyalog, yakın anlam ve kelime gibi kısa sorulardan tam puana yakın, okumadan gerektiği kadar.</p>
  <div class="tblwrap"><table class="tbl"><tr><th>Bölüm</th><th>Soru</th><th>Hedef doğru</th><th></th></tr>${PTYPES.map(x=>{const v=c.t[x[0]];return `<tr><td><a href="#yapi-${x[0]}">${x[1]}</a></td><td>${x[2]}</td><td><b>${v}</b></td><td style="width:40%"><div class="track"><div class="fill" style="width:${v/x[2]*100}%"></div></div></td></tr>`}).join("")}<tr><td><b>Toplam</b></td><td>80</td><td><b>${c.need}</b></td><td></td></tr></table></div>
  <h2>Dönemler</h2><div class="phases">${c.phases.map((x,i)=>`<div class="ph ${i+1===ph?"on":""}"><b>${x[0]}</b><span>${x[1]} · ${x[2]} hafta</span><small>${["Gramer üniteleri, şemalar, kelime günlüğü; her gün bir okuma.","Soru tipleri tek tek: ders notu + set; zayıf konulara ağırlık.","Haftada 1–2 tam deneme, yanlış analizi, sık kelimeler tekrarı."][i]}</small></div>`).join("")}</div>
  <h2>Bugünkü planın · ${p.mins} dakika</h2><p class="small mut">Şu an ${ph}. dönemdesin. Her satır ilgili bölüme götürür.</p>
  <div class="dplan">${dp.map(([k,mn,txt,href])=>`<a href="${href}"><span class="dm">${mn} dk</span><span><b>${k}</b><small>${txt}</small></span><span class="darr">›</span></a>`).join("")}</div>
  ${w.length?`<div class="sbox rd" style="margin-top:10px"><b>Bu hafta zayıf konularına ek süre ayır</b>${w.map(x=>`<a href="${catLink(x[0])}">${x[0]} · %${x[1]}</a>`).join(" · ")}</div>`:""}
  <h2>Haftalık düzen · ${p.days} gün</h2><ul class="wk">
   <li><b>${p.days>=6?"5":"4"} gün</b> günlük plan (yukarıdaki).</li>
   <li><b>1 gün</b> tekrar günü: haftanın yanlışları, kelime setleri, şemalar. Aralıklı tekrar: bir konuyu 1, 3, 7 ve 14 gün sonra yeniden çöz.</li>
   ${ph===3?`<li><b>Hafta sonu</b> 180 dakikalık tam ÖSYM sınavı; cevap kâğıdıyla puanla, ertesi gün yanlış analizi.</li>`:`<li><b>Ayda 2 kez</b> geçmiş bir ÖSYM sınavını süre tutarak çöz; gelişimini cevap kâğıdından izle.</li>`}
   ${p.days<7?`<li><b>${7-p.days} gün</b> dinlenme. Dinlenmek de planın parçası.</li>`:""}</ul>
  <h2>Tavsiyeler</h2><div class="sgrid">
   <div class="sbox bl"><b>Video dersler</b>Bir gramer ünitesine başlamadan önce o konunun video anlatımını izle, sonra uygulamadaki şema ve alıştırmalara geç. Video tek başına yetmez: izlediğin gün en az 20 soru çöz. <a href="https://youtube.com/playlist?list=PLcLB6Eee3OiCpR5kOnKW3pWPQKdBEyOgs" target="_blank" rel="noopener">Örnek gramer oynatma listesi ↗</a></div>
   <div class="sbox gr"><b>Diğer kaynaklarla tekrar</b>Uygulama konuyu öğretir ve pekiştirir; soru hacmini kitaplardan ve geçmiş ÖSYM sınavlarından al. Hangi kitap ne için: <a href="#ekstra">kaynak rehberi</a>.</div>
   <div class="sbox yl"><b>Kelime</b>Her gün yeni kelime + dünkülerin tekrarı. Kelimeyi listeden değil cümleden öğren; günde bir İngilizce makale oku${c.band==="yuksek"?" (hedefin için şart)":""}.</div>
   <div class="sbox lt"><b>Okuma alışkanlığı</b>Her gün 1 metin, süre tutarak. Hedef: bir metni 4 sorusuyla 9–10 dakikada bitirmek.</div>
   <div class="sbox bl"><b>Yanlış defteri</b>Her yanlış ‘Yanlışlarım’a düşer. Haftada bir oradan tekrar çöz; aynı konudan 3 yanlış varsa o ünitenin ders notuna dön.</div>
   <div class="sbox rd"><b>Sınav haftası</b>Yeni konu çalışma; tekrar ve 1 deneme. Sınavdan önceki gün hafif tekrar ve erken uyku.</div></div>
  <p class="small mut">Puan hesabı: YDS'de her doğru 1,25 puan; yanlış doğruyu götürmez. Sınav tarihlerini her zaman ÖSYM'nin sitesinden kontrol et.</p>`;
}
